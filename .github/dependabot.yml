version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    versioning-strategy: increase
    groups:
      typescript-packages:
        patterns:
          - "@types/*"
          - "typescript"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
